<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#212121" />
    <meta
      name="description"
      content="GameHub — All your games. One ultimate vault. Store credentials for PlayStation, Xbox, Steam, and PC in one secure place."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GameHub" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon-gamehub-light.png" />
    <title>GameHub — Multi-Platform Account Manager</title>

    <!-- Theme detection (defaults to dark — GameHub is a dark-first app) -->
    <script>
      (function () {
        try {
          var key = 'gamehub_theme_mode';
          var pref = localStorage.getItem(key) || 'dark';
          var mode = pref;
          if (pref === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {}
      })();
    </script>

    <style>
      /* Monochrome Fitpal-style splash; React overwrites #root on mount. */
      #splash-screen {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100vh;
        z-index: 9999;
        font-family: 'Plus Jakarta Sans', 'Cairo', system-ui, sans-serif;
        background: #212121;
        color: #ECECEC;
      }

      .splash-logo-container {
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        transform: scale(0.8);
        animation: splashLogoEntrance 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
          logoPulseFloat 3s infinite ease-in-out 0.8s;
        filter: none;
      }

      .splash-logo {
        width: 100%;
        height: 100%;
        color: #ECECEC;
      }

      .splash-brand {
        margin-top: 24px;
        text-align: center;
        opacity: 0;
        animation: splashFadeIn 0.8s ease-out 0.4s forwards;
      }

      .splash-title {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 0.06em;
        margin: 0;
        background: linear-gradient(135deg, #FFFFFF, #A3A3A3);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .splash-subtitle {
        font-size: 13px;
        font-weight: 500;
        margin-top: 8px;
        margin-bottom: 0;
        opacity: 0.6;
      }

      .splash-progress-container {
        position: absolute;
        bottom: 60px;
        width: 120px;
        height: 3px;
        border-radius: 4px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
        opacity: 0;
        animation: splashFadeIn 0.8s ease-out 0.6s forwards;
      }

      .splash-progress-bar {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #737373, #E5E5E5);
        transform-origin: 0% 50%;
        animation: splashProgress 1.6s infinite ease-in-out;
      }

      @keyframes splashLogoEntrance {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }

      @keyframes logoPulseFloat {
        0% {
          transform: translateY(0px) scale(1);
        }
        50% {
          transform: translateY(-6px) scale(1.04);
        }
        100% {
          transform: translateY(0px) scale(1);
        }
      }

      @keyframes splashFadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes splashProgress {
        0% {
          transform: translateX(-100%) scaleX(0.2);
        }
        50% {
          transform: translateX(0%) scaleX(0.5);
        }
        100% {
          transform: translateX(100%) scaleX(0.2);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash-screen">
        <div class="splash-logo-container">
          <svg
            class="splash-logo"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="6" y1="11" x2="10" y2="11"></line>
            <line x1="8" y1="9" x2="8" y2="13"></line>
            <line x1="15" y1="12" x2="15.01" y2="12"></line>
            <line x1="18" y1="10" x2="18.01" y2="10"></line>
            <path
              d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.152A4 4 0 0 0 17.32 5z"
            ></path>
          </svg>
        </div>
        <div class="splash-brand">
          <h1 class="splash-title">GAMEHUB</h1>
          <p class="splash-subtitle">All your games. One ultimate vault.</p>
        </div>
        <div class="splash-progress-container">
          <div class="splash-progress-bar"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
