<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#212121" />
    <meta
      name="description"
      content="GameHub — All your games. One ultimate vault. Store credentials for PlayStation, Xbox, Steam, and PC in one secure place."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="GameHub" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/png" href="/favicon-gamehub-light.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>GameHub — Multi-Platform Account Manager</title>

    <!-- Theme detection (defaults to dark — GameHub is a dark-first app) -->
    <script>
      (function () {
        try {
          var key = 'gamehub_theme_mode';
          var pref = localStorage.getItem(key) || 'dark';
          var mode = pref;
          if (pref === 'system') {
            mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', mode);
        } catch (e) {}
      })();
    </script>

    <style>
      .splash-screen {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        width: 100%;
        min-height: 100vh;
        min-height: 100dvh;
        z-index: 9999;
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        background: #ffffff;
        color: #0d0d0d;
      }

      html[data-theme='dark'] .splash-screen {
        background: #212121;
        color: #ececec;
      }

      .splash-logo {
        display: block;
        width: 72px;
        height: 72px;
        object-fit: contain;
        filter: brightness(0);
        animation: splashLogoPulse 2s ease-in-out infinite;
      }

      html[data-theme='dark'] .splash-logo {
        filter: brightness(0) invert(1);
      }

      .splash-content {
        display: grid;
        place-items: center;
      }

      @keyframes splashLogoPulse {
        0%,
        100% {
          opacity: 0.94;
          transform: scale(0.97);
        }
        50% {
          opacity: 1;
          transform: scale(1);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-logo { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash-screen" role="status" aria-label="Loading GameHub">
        <div class="splash-content">
          <img class="splash-logo" src="/logo-black.png" alt="GameHub" />
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
